name: 🚀 CI/CD Pipeline

# Trigger the workflow on push or pull request events for the main branch
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: 🛠️ Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Read-only access to the repository code

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # Download the complete repository history instead of a shallow clone
          persist-credentials: false # Disable writing the access token to local git config for enhanced security
          allow-unsafe-pr-checkout: true # Allow checkout for external forks under protected privileged triggers

      # Configures the Java environment.
      # Update 'java-version' here if you change the Java toolchain in build.gradle.kts
      - name: ☕ Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: "temurin"
          java-version: "21"

      # Sets up Gradle caching and wrapper for faster builds
      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      # Ensures the gradlew script has execution permissions
      - name: 🔐 Make gradlew executable
        run: chmod +x ./gradlew

      # Executes the build process using the Gradle Wrapper
      - name: 🔨 Build with Gradle
        run: ./gradlew build

  dependency-submission:
    name: 📦 Dependency Submission
    runs-on: ubuntu-latest
    permissions:
      contents: write # Write access is required to submit the dependency graph

    steps:
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # Download the complete repository history instead of a shallow clone
          persist-credentials: false # Disable writing the access token to local git config for enhanced security
          allow-unsafe-pr-checkout: true # Allow checkout for external forks under protected privileged triggers

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: "temurin"
          java-version: "21"

      # Generates and submits a dependency graph to GitHub, enabling Dependabot Alerts
      - name: 📊 Submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb
