name: ProAntiTab
description: Hides more than just your plugins.
website: https://www.rayzs.de/products/proantitab/page

author: Rayzs_YT
version: 2.5.1
api-version: 1.13
folia-supported: true
main: de.rayzs.pat.plugin.BukkitLoader

softdepend: [PlaceholderAPI, LuckPerms, GroupManager, Skript, ViaVersion, ViaBackwards, ViaRewind]

libraries:
  - net.kyori:adventure-platform-bukkit:4.4.1
  - net.kyori:adventure-text-minimessage:5.2.0
  - net.kyori:adventure-api:5.2.0
  - net.kyori:adventure-text-serializer-legacy:5.2.0

commands:
  proantitab:
    aliases: [pat]
    permission: proantitab.use